# Runs when a maintainer pushes a version tag (vX.Y.Z). Agents never push tags.
# It checks the code, pushes the multi-arch image to GHCR by its digest only (no tags), builds
# the Worker bundle and the migrations, writes the release manifest (checkend-release.json,
# format 1; the reader is checkend-cli internal/serverrelease) and makes a DRAFT release. Then it
# signs the manifest in the environment "release" (a maintainer approves the job; the key is a
# secret of that environment only), checks the signature with release/allowed_signers, and
# publishes the release. Only then does the tag job add :X.Y.Z, :X.Y and :latest to the image
# digest that the signed manifest pins. A published release is never unsigned, and a public
# image tag never points to an image that no maintainer approved.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# One release run per tag, never cancelled halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The server reports the version of package.json (/health, Settings, the image).
      - name: The tag matches the package.json version
        run: |
          have=$(node -p 'require("./package.json").version')
          [ "$have" = "${TAG#v}" ] || { echo "Set package.json version to ${TAG#v} first (it is $have)."; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  image:
    name: Build and push the ghcr.io image by digest (no tags)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      name: ${{ steps.name.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image name in lowercase (a registry name has no capitals).
      - id: name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # The tags are computed here (for the labels), but the tag job pushes them after sign.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      # Pushed by digest only: no tag points to it before the sign job is approved. The digest
      # output is the digest of the image index (all platforms): the manifest pins it.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ steps.name.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  build:
    name: Bundle, manifest and draft release
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # the draft release
    env:
      TAG: ${{ github.ref_name }}
      COMMIT: ${{ github.sha }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
      # The HTTPS proxies of `ce server install ssh`, pinned below by their multi-arch digest.
      CADDY_IMAGE: docker.io/library/caddy:2
      CLOUDFLARED_IMAGE: docker.io/cloudflare/cloudflared:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: npm ci
      - name: Bundle the Worker and the migrations
        run: |
          set -eu
          VERSION="${TAG#v}"
          npx wrangler deploy --dry-run --outdir dist
          test -f dist/worker.js
          # Reproducible archives: sorted names, no owner, a fixed time.
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 \
            -czf "checkend-worker-$VERSION.tar.gz" -C dist worker.js
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 \
            -czf "checkend-migrations-$VERSION.tar.gz" migrations/*.sql
      - name: Pin the proxy images by their multi-arch digest
        run: |
          set -eu
          pin() {
            index=$(docker buildx imagetools inspect "$1" --format '{{json .Manifest}}')
            echo "$index" | jq -e '.mediaType | test("index|manifest.list")' > /dev/null \
              || { echo "$1 is not a multi-arch image index." >&2; exit 1; }
            echo "${1%:*}@$(echo "$index" | jq -r .digest)"
          }
          echo "CADDY_REF=$(pin "$CADDY_IMAGE")" >> "$GITHUB_ENV"
          echo "CLOUDFLARED_REF=$(pin "$CLOUDFLARED_IMAGE")" >> "$GITHUB_ENV"
      - name: Write the manifest and SHA256SUMS
        run: |
          set -eu
          VERSION="${TAG#v}"
          node scripts/release-manifest.ts --version "$VERSION" --commit "$COMMIT" \
            --worker "checkend-worker-$VERSION.tar.gz" \
            --migrations "checkend-migrations-$VERSION.tar.gz" \
            --image-digest "$IMAGE_DIGEST" --caddy "$CADDY_REF" --cloudflared "$CLOUDFLARED_REF" \
            --out checkend-release.json
          sha256sum "checkend-worker-$VERSION.tar.gz" "checkend-migrations-$VERSION.tar.gz" \
            checkend-release.json > SHA256SUMS
          cat checkend-release.json
      - name: Make the draft release (without the signature)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          gh release create "$TAG" --draft --verify-tag --title "$TAG" \
            --notes "Checkend $VERSION. The release manifest is signed (see Backup and upgrade in the docs)." \
            --repo "$GITHUB_REPOSITORY" \
            "checkend-worker-$VERSION.tar.gz" "checkend-migrations-$VERSION.tar.gz" \
            checkend-release.json SHA256SUMS

  sign:
    name: Sign the manifest and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # upload the signature, then publish the draft release
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Sign the exact bytes that the draft release holds.
      - name: Download the manifest of the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern checkend-release.json --repo "$GITHUB_REPOSITORY"
      - name: Sign
        env:
          SIGNING_KEY: ${{ secrets.SERVER_RELEASE_SIGNING_KEY }}
        run: |
          set +x
          [ -n "$SIGNING_KEY" ] || { echo "The secret SERVER_RELEASE_SIGNING_KEY of the environment release is missing."; exit 1; }
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/server-release-key"
          ssh-keygen -Y sign -q -f "$RUNNER_TEMP/server-release-key" -n checkend-server-release checkend-release.json
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/server-release-key"
      - name: Check the signature with release/allowed_signers
        run: |
          ssh-keygen -Y verify -f release/allowed_signers -I server-2026 -n checkend-server-release \
            -s checkend-release.json.sig < checkend-release.json \
            || { echo "The signature does not verify with release/allowed_signers: the release stays a draft."; exit 1; }
      - name: Upload the signature and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" checkend-release.json.sig --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  tag:
    name: Tag the ghcr.io image (:X.Y.Z, :X.Y, :latest)
    needs: [image, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.ref_name }}
      IMAGE: ${{ needs.image.outputs.name }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
      IMAGE_TAGS: ${{ needs.image.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tags go only to the image that the published, signed manifest pins.
      - name: Check the digest against the signed manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release download "$TAG" --pattern checkend-release.json --pattern checkend-release.json.sig \
            --repo "$GITHUB_REPOSITORY"
          ssh-keygen -Y verify -f release/allowed_signers -I server-2026 -n checkend-server-release \
            -s checkend-release.json.sig < checkend-release.json
          repository=$(jq -r .image.repository checkend-release.json)
          signed=$(jq -r .image.digest checkend-release.json)
          [ "$repository" = "$IMAGE" ] || { echo "The manifest names $repository, not $IMAGE."; exit 1; }
          [ "$signed" = "$IMAGE_DIGEST" ] || { echo "The manifest pins $signed, not $IMAGE_DIGEST."; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Add the tags to the signed digest, then check each tag
        run: |
          set -eu
          args=""
          for tag in $IMAGE_TAGS; do args="$args --tag $tag"; done
          [ -n "$args" ] || { echo "No tags to add."; exit 1; }
          # shellcheck disable=SC2086 # one --tag argument per word
          docker buildx imagetools create $args "$IMAGE@$IMAGE_DIGEST"
          for tag in $IMAGE_TAGS; do
            got=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
            [ "$got" = "$IMAGE_DIGEST" ] || { echo "$tag points to $got, not $IMAGE_DIGEST."; exit 1; }
          done
