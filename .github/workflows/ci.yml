name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Worker types are up to date
        run: npm run types:check
      - run: npm run typecheck
      - name: Tests (Node + workerd)
        run: npm test
      - name: CPU budget (alone)
        run: npm run test:perf
      - name: Worker bundle builds
        run: npx wrangler deploy --dry-run --outdir dist

  node-runtime:
    name: Node runtime (no Cloudflare), Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Node tests (core, SQLite, Node adapters, the server)
        run: npx vitest run --project node
      - name: The server starts and answers
        env:
          DATABASE_PATH: ${{ runner.temp }}/checkend.sqlite
          PORT: "8790"
          HOST: 127.0.0.1
          ADMIN_TOKEN: ci-admin-token-0123456789
        run: |
          node src/entry/server.ts &
          PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8790/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8790/health | grep -q '"status":"ok"'
          kill -TERM "$PID"
          wait "$PID"

  docker-image:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build (no push)
        run: docker build -t checkend:ci .
      - name: Start, answer, back up, and stop with SIGTERM
        run: |
          docker run -d --name checkend -p 8791:8787 -e ADMIN_TOKEN=ci-admin-token-0123456789 checkend:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8791/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8791/health | grep -q '"status":"ok"'
          docker exec checkend node scripts/backup.ts /data/backup.sqlite
          docker exec checkend id -u | grep -vq '^0$'
          docker stop --time 20 checkend
          test "$(docker inspect -f '{{.State.ExitCode}}' checkend)" = "0"

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan
        run: ./gitleaks git --redact --no-banner -c .gitleaks.toml .

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check sign-offs
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            scripts/check-dco.sh "$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            scripts/check-dco.sh "$PUSH_BEFORE..$PUSH_AFTER"
          else
            echo "No range to check."
          fi
